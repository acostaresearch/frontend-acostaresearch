<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Acosta | IA &amp; Research — El método de tesis, dentro de tu Claude</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nueve capítulos que acompañan la redacción de tu tesis desde tu propio Claude: preguntan, explican el criterio metodológico y ordenan lo que tú decides."
    />
    <meta name="theme-color" content="#1a56db" />

    <!-- Iconos.
         El .ico lleva 16, 32 y 48 px dentro y lo entienden hasta los clientes
         antiguos; el PNG de 32 es el que usan los navegadores modernos, y el de
         180 es el que guarda iOS cuando alguien añade la web a su pantalla de
         inicio. Las rutas van absolutas: una relativa se rompe si algún día
         cambia el `base href`. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Vista previa al compartir el enlace.
         Sin esto, pegar acostaresearch.com en WhatsApp deja un enlace desnudo,
         sin título ni imagen. Y WhatsApp es por donde entra la venta, así que
         ese recuadro es la primera impresión que se lleva un tesista. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Acosta | IA &amp; Research" />
    <meta property="og:title" content="El método de tesis, dentro de tu propio Claude" />
    <meta
      property="og:description"
      content="Nueve capítulos que te acompañan mientras redactas: preguntan, explican el criterio metodológico y ordenan lo que tú decides."
    />
    <meta property="og:url" content="https://acostaresearch.com/" />
    <meta property="og:image" content="https://acostaresearch.com/icono-512.png" />
    <meta property="og:locale" content="es_PE" />
    <meta name="twitter:card" content="summary" />
  </head>
