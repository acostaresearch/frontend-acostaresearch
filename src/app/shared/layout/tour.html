@if (tour.paso(); as paso) {
  <!-- La capa que se come las pulsaciones. El agujero tampoco es interactivo:
       ver la nota de la clase. -->
  <div class="capa" [class.sola]="!foco()"></div>

  <!-- El foco. El velo que oscurece el resto sale de su propia sombra, que es
       lo que recorta el agujero: un fondo no se puede agujerear desde otro
       elemento. `100vmax` de extensión cubre cualquier pantalla. -->
  @if (foco(); as f) {
    <div
      class="foco"
      aria-hidden="true"
      [style.top.px]="f.top"
      [style.left.px]="f.left"
      [style.width.px]="f.ancho"
      [style.height.px]="f.alto"
    ></div>
  }

  <div
    #caja
    class="globo"
    [class.flotante]="globo()"
    [class.abajo]="abajo()"
    [style.top.px]="globo()?.top"
    [style.left.px]="globo()?.left"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tour-titulo"
    aria-describedby="tour-texto"
  >
    <!-- La aspa, arriba a la derecha: es donde se cierra cualquier cosa que se
         abre encima, y quien quiere salir la busca ahí antes de leer nada. El
         «Saltar» de abajo se queda para quien no la ve. -->
    <button type="button" class="aspa" (click)="tour.terminar()" aria-label="Cerrar el recorrido">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="M6 6l12 12M18 6L6 18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <p class="cuenta">{{ tour.numero() }} de {{ tour.total() }}</p>
    <h3 id="tour-titulo">{{ paso.titulo }}</h3>
    <p id="tour-texto" class="texto">{{ paso.texto }}</p>

    <div class="barra" aria-hidden="true">
      @for (punto of puntos(); track punto) {
        <span [class.hecho]="punto <= tour.numero()"></span>
      }
    </div>

    <div class="pie">
      <!-- Saltar a la izquierda y separado: se sale cuando se quiere, sin
           buscarlo, pero no se pulsa por inercia al avanzar. -->
      <button type="button" class="boton enlace saltar" (click)="tour.terminar()">Saltar</button>

      <div class="avanzar">
        @if (!tour.esElPrimero()) {
          <button type="button" class="boton secundario" (click)="tour.anterior()">Atrás</button>
        }
        <button #avanzar type="button" class="boton" (click)="tour.siguiente()">
          {{ tour.esElUltimo() ? 'Listo' : 'Siguiente' }}
        </button>
      </div>
    </div>
  </div>
}
