<header class="cabecera">
  <div class="contenido">
    <a class="marca" routerLink="/">
      <span class="marca-nombre">Acosta</span>
      <span class="marca-cola">IA &amp; Research</span>
    </a>

    <!-- Solo se ve en móvil. `aria-expanded` es lo que le dice a un lector de
         pantalla si el menú está abierto; sin eso el botón se anuncia como un
         botón cualquiera que no se sabe qué hace. -->
    <button
      type="button"
      class="hamburguesa"
      [class.abierta]="menuAbierto()"
      [attr.aria-expanded]="menuAbierto()"
      [attr.aria-label]="menuAbierto() ? 'Cerrar el menú' : 'Abrir el menú'"
      aria-controls="menu-principal"
      (click)="alternarMenu()"
    >
      <span class="barra" aria-hidden="true"></span>
      <span class="barra" aria-hidden="true"></span>
      <span class="barra" aria-hidden="true"></span>
    </button>

    <!-- Enlaces y acciones viven dentro del mismo envoltorio para no escribirlos
         dos veces, una para cada tamaño de pantalla. En escritorio el
         envoltorio no existe (`display: contents`) y los dos bloques quedan
         como estaban; en móvil se convierte en el desplegable. -->
    <div id="menu-principal" class="menu" [class.abierto]="menuAbierto()">
      <nav class="navegacion" data-tour="menu">
        <a routerLink="/metodo" routerLinkActive="activo">Las 11 Skills</a>
        <a routerLink="/articulo" routerLinkActive="activo">Artículos</a>
        <a routerLink="/en-accion" routerLinkActive="activo">Míralo en acción</a>
        <a routerLink="/quien-soy" routerLinkActive="activo">Quién soy</a>
        <a routerLink="/planes" routerLinkActive="activo" data-tour="comprar">Comprar</a>
      </nav>

      <div class="acciones">
        @if (auth.isAuthenticated()) {
          <!-- Un solo destino por persona, no dos. Al administrador le llevaba a
               «Administrar» y a «Mi perfil» a la vez, y entre las dos gana siempre
               la primera: al panel se entra a diario y al perfil casi nunca. Sus
               datos y su contraseña están en la pestaña «Cuentas» del panel, que
               es el mismo formulario que ve cualquiera en su perfil. -->
          @if (auth.hasRole('ADMIN')) {
            <a class="boton secundario" routerLink="/admin" routerLinkActive="activo">Administrar</a>
          } @else {
            <a class="boton secundario" routerLink="/perfil" routerLinkActive="activo">Mi perfil</a>
          }
          <button type="button" class="enlace-salir" (click)="salir()">Cerrar sesión</button>
        } @else {
          <a class="enlace-entrar" routerLink="/auth/login">Iniciar sesión</a>
          <a class="boton" routerLink="/auth/registro">Crear cuenta</a>
        }
      </div>
    </div>

    <!-- El recorrido guiado de la web. Fuera del menú, al lado del tema: sale
         solo la primera vez, y quien lo saltó o quiere repetirlo tiene que
         encontrarlo sin buscar. La brújula, y no un «?», porque esto enseña
         dónde está cada cosa; el signo de interrogación promete respuestas y
         lleva a las preguntas frecuentes. Ver `TourService`. -->
    <button
      type="button"
      class="recorrido"
      data-tour="recorrido"
      aria-label="Ver el recorrido guiado de la web"
      title="Ver el recorrido guiado"
      (click)="verElRecorrido()"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="m15.6 8.4-2.1 5.1-5.1 2.1 2.1-5.1z" />
      </svg>
    </button>

    <!-- El icono enseña a dónde lleva, no dónde se está: la luna en claro, el
         sol en oscuro. Fuera del menú, para que en móvil no haya que abrirlo. -->
    <button
      type="button"
      class="tema"
      [attr.aria-label]="tema.tema() === 'oscuro' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      [attr.title]="tema.tema() === 'oscuro' ? 'Modo claro' : 'Modo oscuro'"
      (click)="tema.alternar()"
    >
      @if (tema.tema() === 'oscuro') {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>
  </div>
</header>
