# Despliegue del frontend en Netlify.
#
# Lo que ponga aquí gana sobre lo que se escriba en el panel, así que la
# configuración vive en el repositorio y no en una pantalla que nadie recuerda
# haber tocado.

[build]
  command = "npm run build"
  # Angular 17+ parte la salida en dos: `browser` (lo que va al navegador) y
  # `prerendered-routes.json`. Publicar `dist/` a secas sirve una carpeta sin
  # index.html y el sitio entero responde 404.
  publish = "dist/acostaresearch-frontend/browser"

[build.environment]
  # Angular 22 exige Node 20 o más. Sin fijarlo, Netlify puede elegir uno más
  # viejo y el build falla con un error que no dice que la causa sea la versión.
  NODE_VERSION = "22"

  # ── Escáner de secretos ───────────────────────────────────────────────────
  #
  # Netlify aborta el despliegue si encuentra el valor de una variable del panel
  # dentro del paquete compilado. La intención es buena, pero aquí se dispara
  # con diez variables que NO son secretas y que tienen que estar en el paquete
  # para que la web funcione:
  #
  #   · Las siete URLs de redes son enlaces públicos del pie de página. Su razón
  #     de existir es que la gente los vea.
  #   · Los client ID de Google y PayPal son públicos POR DISEÑO: viajan en el
  #     HTML de cualquier visitante y en la URL del SDK de PayPal. Lo que
  #     protege a esas cuentas es el origen autorizado en cada consola, no que
  #     el identificador esté escondido; ocultarlo no aportaría nada y ni
  #     siquiera es posible.
  #
  # Se listan una a una en vez de apagar el escáner entero (SECRETS_SCAN_ENABLED
  # = false), para que siga vigilando: el día que alguien meta por descuido una
  # clave de verdad —un secreto de PayPal, la contraseña de la base de datos— el
  # despliegue tiene que seguir parándose.
  SECRETS_SCAN_OMIT_KEYS = "WHATSAPP_URL,TIKTOK_URL,YOUTUBE_URL,INSTAGRAM_URL,FACEBOOK_URL,SCHOLAR_URL,CTIVITAE_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_ID_DEV,PAYPAL_CLIENT_ID"

# ── La API ──────────────────────────────────────────────────────────────────
#
# El frontend llama a `/api/v1/...` en su propio dominio y Netlify lo reenvía al
# backend. Se hace así, y no apuntando el frontend directamente al backend, por
# la cookie de sesión: el refresh token viaja en una cookie httpOnly, y entre
# dominios distintos haría falta SameSite=None + CORS con credenciales, que es
# justo donde se rompen estas cosas. Con el proxy todo es del mismo origen.
#
# El backend vive en un servidor propio (Hetzner, Núremberg), junto a la base de
# datos de Clever Cloud (París): así una petición no cruza el Atlántico una vez
# por cada consulta a la base, que es lo que pasaba con el backend en local.
#
# PROVISIONAL: sslip.io resuelve el nombre a partir de la IP del servidor.
# Cuando haya dominio propio, se cambia aquí y en MCP_PUBLIC_URL del backend.
[[redirects]]
  from = "/api/*"
  to = "https://2-28-64-216.sslip.io/api/:splat"
  status = 200
  force = true

# ── Rutas de Angular ────────────────────────────────────────────────────────
#
# Va la última a propósito: cualquier petición que no sea un archivo real ni la
# API devuelve el index.html para que el router de Angular resuelva. Sin esto,
# entrar directo a /metodo o /privacidad —o recargar con F5— da 404, porque en
# el servidor esas carpetas no existen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
